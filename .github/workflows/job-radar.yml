name: Job Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"

permissions:
  contents: read

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  job-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run quality checks
        run: python -m poethepoet check

      - name: Run job radar
        run: python job_radar.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RADAR_PROFILE_JSON: ${{ secrets.JOB_RADAR_PROFILE_JSON }}
          JOB_RADAR_PROFILE_CONFIG: ${{ vars.JOB_RADAR_PROFILE_CONFIG }}
          JOB_RADAR_SETTINGS_CONFIG: ${{ vars.JOB_RADAR_SETTINGS_CONFIG }}
          JOB_RADAR_CONFIG: ${{ vars.JOB_RADAR_CONFIG }}
          DOU_RSS_URLS: ${{ vars.DOU_RSS_URLS }}
          DJINNI_RSS_URLS: ${{ vars.DJINNI_RSS_URLS }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MAX_JOBS_PER_RUN: ${{ vars.MAX_JOBS_PER_RUN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_TIMEOUT_SECONDS: ${{ vars.OPENAI_TIMEOUT_SECONDS }}
          OPENAI_MAX_RETRIES: ${{ vars.OPENAI_MAX_RETRIES }}
          OPENAI_MAX_COMPLETION_TOKENS: ${{ vars.OPENAI_MAX_COMPLETION_TOKENS }}
          OPENAI_INPUT_COST_PER_1M: ${{ vars.OPENAI_INPUT_COST_PER_1M }}
          OPENAI_OUTPUT_COST_PER_1M: ${{ vars.OPENAI_OUTPUT_COST_PER_1M }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LOG_COLOR: ${{ vars.LOG_COLOR }}
