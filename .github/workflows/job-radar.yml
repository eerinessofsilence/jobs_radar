name: Job Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"

jobs:
  job-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job radar
        run: python job_radar.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RADAR_CONFIG: ${{ vars.JOB_RADAR_CONFIG }}
          DOU_RSS_URLS: ${{ vars.DOU_RSS_URLS }}
          DJINNI_RSS_URLS: ${{ vars.DJINNI_RSS_URLS }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MAX_JOBS_PER_RUN: ${{ vars.MAX_JOBS_PER_RUN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LOG_COLOR: ${{ vars.LOG_COLOR }}
